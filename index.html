<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library</title>
  <meta name="description" content="A personal library of research papers, with summaries and notes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='10' y='3.5' width='17' height='22' rx='2.5' fill='none' stroke='%2393b4f5' stroke-width='1.6'/%3E%3Crect x='5.5' y='7' width='17' height='22' rx='2.5' fill='%23fff' stroke='%232563eb' stroke-width='1.8'/%3E%3Cpath d='M9.5 13.5h9M9.5 17.5h9M9.5 21.5h6' stroke='%232563eb' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    try { if (localStorage.getItem('exlibris:theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body class="loading">
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Library navigation"></aside>
    <div class="scrim" data-action="close-sidebar"></div>
    <main class="main">
      <header class="topbar" id="topbar"></header>
      <div class="view" id="view">
        <div class="boot"><span class="boot-dot"></span><span class="boot-dot"></span><span class="boot-dot"></span></div>
      </div>
    </main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>
  <dialog id="palette" class="palette-dialog"></dialog>
  <noscript><p style="padding:2rem;font-family:serif">This library needs JavaScript.</p></noscript>
</body>
</html>
